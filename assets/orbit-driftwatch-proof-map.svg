<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Orbit-Driftwatch portfolio proof map</title>
  <desc id="desc">Architecture overview showing question input, provider boundary, four agent roles, claim and evidence inspection, Driftwatch observability, Orbit interpretation, and portable run artifacts.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #4b5563; }
    .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 14; }
    .label { font-size: 18px; font-weight: 650; }
    .small { font-size: 14px; fill: #4b5563; }
    .arrow { stroke: #4b5563; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .role { fill: #ffffff; stroke: #6b7280; stroke-width: 1.7; rx: 10; }
    .boundary { fill: #f3f4f6; stroke: #111827; stroke-width: 2.2; rx: 14; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="60" y="62" class="title">Orbit-Driftwatch — inspect the workflow, not only the answer</text>
  <text x="60" y="94" class="subtitle">Source-aware multi-agent observability with deterministic controls and fail-closed claim auditing.</text>

  <rect x="60" y="145" width="160" height="84" class="box"/>
  <text x="140" y="179" text-anchor="middle" class="label">Question</text>
  <text x="140" y="204" text-anchor="middle" class="small">user input</text>

  <rect x="270" y="125" width="215" height="125" class="boundary"/>
  <text x="377" y="158" text-anchor="middle" class="label">Provider boundary</text>
  <text x="377" y="187" text-anchor="middle" class="small">deterministic control</text>
  <text x="377" y="211" text-anchor="middle" class="small">or server-only OpenAI adapter</text>
  <text x="377" y="235" text-anchor="middle" class="small">bounded source records</text>

  <rect x="540" y="112" width="145" height="62" class="role"/>
  <text x="612" y="149" text-anchor="middle" class="label">Planner</text>
  <rect x="710" y="112" width="145" height="62" class="role"/>
  <text x="782" y="149" text-anchor="middle" class="label">Researcher</text>
  <rect x="540" y="197" width="145" height="62" class="role"/>
  <text x="612" y="234" text-anchor="middle" class="label">Skeptic</text>
  <rect x="710" y="197" width="145" height="62" class="role"/>
  <text x="782" y="234" text-anchor="middle" class="label">Verifier</text>

  <rect x="905" y="130" width="235" height="120" class="box"/>
  <text x="1022" y="162" text-anchor="middle" class="label">Claims + evidence</text>
  <text x="1022" y="190" text-anchor="middle" class="small">sourceRefs / conflicts</text>
  <text x="1022" y="214" text-anchor="middle" class="small">unsupported-claim checks</text>
  <text x="1022" y="238" text-anchor="middle" class="small">fail-closed validation</text>

  <rect x="250" y="355" width="260" height="120" class="box"/>
  <text x="380" y="389" text-anchor="middle" class="label">Driftwatch observability</text>
  <text x="380" y="419" text-anchor="middle" class="small">disagreement · evidence coverage</text>
  <text x="380" y="444" text-anchor="middle" class="small">unsupported claims · role trace</text>

  <rect x="585" y="355" width="255" height="120" class="box"/>
  <text x="712" y="389" text-anchor="middle" class="label">Orbit interpretation</text>
  <text x="712" y="419" text-anchor="middle" class="small">Today · Patterns</text>
  <text x="712" y="444" text-anchor="middle" class="small">Open Questions</text>

  <rect x="915" y="355" width="225" height="120" class="box"/>
  <text x="1027" y="389" text-anchor="middle" class="label">Portable evidence</text>
  <text x="1027" y="419" text-anchor="middle" class="small">JSON run artifact</text>
  <text x="1027" y="444" text-anchor="middle" class="small">provider + source identity</text>

  <path d="M220 187 H270" class="arrow"/>
  <path d="M485 187 H535" class="arrow"/>
  <path d="M855 187 H900" class="arrow"/>
  <path d="M1022 250 V310 H380 V350" class="arrow"/>
  <path d="M510 415 H580" class="arrow"/>
  <path d="M840 415 H910" class="arrow"/>

  <text x="60" y="550" class="label">Evidence boundary</text>
  <text x="60" y="580" class="small">Deterministic controls and repository behavior are CI-tested. Live hosted model-backed execution remains a separate verification boundary.</text>
</svg>