name: Materialize lifecycle review once

on:
  push:
    branches:
      - ecosystem/resolve-lifecycle-pending-2026-09-17

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence-reviewed lifecycle decisions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          registry_path = Path("ecosystem/repository-lifecycle.json")
          companion_path = Path("docs/ECOSYSTEM_LIFECYCLE.md")
          data = json.loads(registry_path.read_text(encoding="utf-8"))

          updates = {
              "ndrorchestration/aetherwake-jrpg": {
                  "review_status": "VERIFIED",
                  "lifecycle": "INCUBATING",
                  "responsibility": "Private Aetherwake JRPG prototype and game-development track.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Substantive specification and baseline implementation verified; incubating rather than historical/archive.",
              },
              "ndrorchestration/unsloth": {
                  "review_status": "VERIFIED",
                  "lifecycle": "ARCHIVE_CANDIDATE",
                  "responsibility": "Third-party Unsloth upstream snapshot with no current ecosystem implementation responsibility.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Fork head is upstream-derived with no local authored branches or active account dependency found; preserve Apache-2.0/upstream provenance. Archive action requires final dependency/readback gate.",
              },
              "ndrorchestration/fabastrunck__cli": {
                  "review_status": "VERIFIED",
                  "lifecycle": "EXTERNAL_REFERENCE",
                  "responsibility": "External CLI contribution/reference fork retained while upstream PR #2 remains open; upstream remains canonical.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Target bounty issue #1 is closed/not-planned, but account PR #2 remains open; preserve upstream provenance and adjudicate open work before archival.",
              },
              "ndrorchestration/deliverymanager__cordova-plugin-media-capture": {
                  "review_status": "VERIFIED",
                  "lifecycle": "EXTERNAL_REFERENCE",
                  "responsibility": "External Cordova media-capture contribution/reference fork retained while upstream PR #2 remains open; upstream remains canonical.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Funded upstream issue #1 and account PR #2 remain open; preserve Apache/upstream lineage and contribution provenance.",
              },
              "ndrorchestration/drydart__flutter_android": {
                  "review_status": "VERIFIED",
                  "lifecycle": "EXTERNAL_REFERENCE",
                  "responsibility": "External Flutter Android contribution/reference fork retained while upstream PR #17 remains open; upstream remains canonical.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Funded upstream issue #1 and account PR #17 remain open; preserve upstream provenance and contribution branch.",
              },
              "ndrorchestration/Soroban-Eas__soroban-sas": {
                  "review_status": "VERIFIED",
                  "lifecycle": "ARCHIVE_CANDIDATE",
                  "responsibility": "Completed Soroban SAS contribution-attempt fork with no current ecosystem responsibility.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Upstream issue #31 is closed/completed and account PRs #42/#43 are closed unmerged; preserve contribution-attempt provenance. Archive action requires final dependency/readback gate.",
              },
              "ndrorchestration/GatorEducator__gatorgrader": {
                  "review_status": "VERIFIED",
                  "lifecycle": "EXTERNAL_REFERENCE",
                  "responsibility": "External GatorGrader contribution/reference fork retained while upstream PRs #290/#291 remain open; upstream remains canonical.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Account Hermes contribution branches back open upstream PRs #290/#291; preserve upstream and contribution provenance.",
              },
              "ndrorchestration/eliezerkirubi-sys__quadcopter-rl-control": {
                  "review_status": "VERIFIED",
                  "lifecycle": "EXTERNAL_REFERENCE",
                  "responsibility": "External quadcopter RL contribution/reference fork retained while upstream PRs #24/#25/#26 remain open; upstream remains canonical.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Three account Hermes branches back open upstream PRs #24/#25/#26; preserve upstream and contribution provenance.",
              },
              "ndrorchestration/lily-contracts": {
                  "review_status": "VERIFIED",
                  "lifecycle": "EXTERNAL_REFERENCE",
                  "responsibility": "External Lily Protocol contribution/reference fork retained as successful upstream contribution provenance; upstream remains canonical.",
                  "reviewed_at": "2026-09-17",
                  "notes": "Upstream PR #166 from this fork merged on 2026-09-02; preserve successful contribution provenance and do not present the fork as original portfolio work.",
              },
          }

          seen = set()
          for record in data["repositories"]:
              repo = record["repository"]
              if repo in updates:
                  record.update(updates[repo])
                  seen.add(repo)
          missing = set(updates) - seen
          if missing:
              raise SystemExit(f"missing expected repositories: {sorted(missing)}")

          data["generated_at"] = "2026-09-17"

          repos = data["repositories"]
          assert len(repos) == 47
          assert sum(r["review_status"] == "VERIFIED" for r in repos) == 47
          assert sum(r["review_status"] == "PENDING_REVIEW" for r in repos) == 0
          assert sum(r["review_status"] == "CONFLICTED" for r in repos) == 0
          assert sum(r["lifecycle"] == "ARCHIVE_CANDIDATE" for r in repos) == 5
          assert sum(r["lifecycle"] == "ARCHIVED" for r in repos) == 1

          registry_path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          text = companion_path.read_text(encoding="utf-8")
          text = re.sub(
              r"\*\*Reviewed:\*\* \d{4}-\d{2}-\d{2}",
              "**Reviewed:** 2026-09-17",
              text,
              count=1,
          )

          census = """The current connected GitHub owner census contains **47 repositories**:\n\n- **47 `VERIFIED`** lifecycle classifications;\n- **0 `PENDING_REVIEW`** classifications;\n- **0 `CONFLICTED`** classifications;\n- **5 `ARCHIVE_CANDIDATE`** repositories awaiting the final archive gate; and\n- **1 already `ARCHIVED`** repository."""
          text, n = re.subn(
              r"The current connected GitHub owner census contains \*\*47 repositories\*\*:\n\n.*?\n\nA verified lifecycle",
              census + "\n\nA verified lifecycle",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("failed to replace census block")

          incubating_anchor = "- `SP1` — game-project home whose current identity and implementation are still minimally documented."
          incubating_add = incubating_anchor + "\n- `aetherwake-jrpg` — private JRPG prototype with a substantive technical specification and fresh baseline implementation; retained as an incubating game-development track."
          if "`aetherwake-jrpg` — private JRPG prototype" not in text:
              text = text.replace(incubating_anchor, incubating_add, 1)

          archive_anchor = "- `DGAF-Google-AIStudio` — generic AI Studio scaffold; no established current DGAF implementation responsibility or account references outside this cleanup."
          archive_add = archive_anchor + "\n- `unsloth` — upstream-derived Unsloth snapshot with no local authored branch or active account dependency found; preserve Apache-2.0/upstream provenance.\n- `Soroban-Eas__soroban-sas` — contribution-attempt fork whose upstream issue is completed and whose account PRs are closed unmerged; no separate active account responsibility found."
          if "`unsloth` — upstream-derived Unsloth snapshot" not in text:
              text = text.replace(archive_anchor, archive_add, 1)

          resolved_section = """## External/reference forks\n\nThe following fork-derived repositories have a concrete retained contribution/reference purpose. Upstream remains canonical, and these forks are not counted as original authored portfolio projects:\n\n| Repository | Verified upstream/source | Retention evidence |\n|---|---|---|\n| `fabastrunck__cli` | `fabastrunck/cli` | Account PR #2 remains open; retain until the open contribution is adjudicated. |\n| `deliverymanager__cordova-plugin-media-capture` | `apache/cordova-plugin-media-capture` source lineage | Funded issue #1 and account PR #2 remain open. |\n| `drydart__flutter_android` | `drydart/flutter_android` | Funded issue #1 and account PR #17 remain open. |\n| `GatorEducator__gatorgrader` | `GatorEducator/gatorgrader` | Account PRs #290/#291 remain open. |\n| `eliezerkirubi-sys__quadcopter-rl-control` | `eliezerkirubi-sys/quadcopter-rl-control` | Account PRs #24/#25/#26 remain open. |\n| `lily-contracts` | `Lilly-Protocol/lily-contracts` | Account PR #166 was merged on 2026-09-02; retain as successful upstream-contribution provenance/reference. |\n\nFork provenance and contribution history establish origin and a bounded retention reason only; they do not transfer upstream authority or make these repositories original portfolio projects.\n\n## Remaining pending review\n\nNo repositories remain `PENDING_REVIEW` at this checkpoint. New ambiguity must be recorded explicitly rather than inferred into an existing lifecycle.\n\n"""
          text, n = re.subn(
              r"## Verified fork provenance, retention still unresolved\n.*?(?=## Separate-repository rule)",
              resolved_section,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("failed to replace unresolved fork/pending-review sections")

          next_work = """## Next reconciliation work\n\n1. adjudicate retained open upstream contribution PRs before any related archive decision;\n2. execute archival only for candidates satisfying every archive predicate and verify `archived=true` by readback;\n3. continue correcting stale account/repository authority language where found;\n4. synchronize DGAF and workspace projections after the canonical lifecycle merge without creating competing sources of truth.\n\n"""
          text, n = re.subn(
              r"## Next reconciliation work\n.*?(?=The machine-readable registry remains)",
              next_work,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("failed to replace next-work section")

          companion_path.write_text(text, encoding="utf-8")
          PY

      - name: Validate lifecycle registry and focused tests
        shell: bash
        run: |
          python scripts/validate_repository_lifecycle.py ecosystem/repository-lifecycle.json
          python -m unittest discover -s tests -p 'test_repository_lifecycle.py' -v

      - name: Confirm projected census
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ecosystem/repository-lifecycle.json").read_text())
          repos = data["repositories"]
          assert len(repos) == 47
          assert sum(r["review_status"] == "VERIFIED" for r in repos) == 47
          assert sum(r["review_status"] == "PENDING_REVIEW" for r in repos) == 0
          assert sum(r["lifecycle"] == "ARCHIVE_CANDIDATE" for r in repos) == 5
          assert sum(r["lifecycle"] == "ARCHIVED" for r in repos) == 1
          companion = Path("docs/ECOSYSTEM_LIFECYCLE.md").read_text()
          assert "**47 `VERIFIED`**" in companion
          assert "**0 `PENDING_REVIEW`**" in companion
          assert "**5 `ARCHIVE_CANDIDATE`**" in companion
          PY

      - name: Commit validated canonical updates and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lifecycle-resolution-once.yml
          git add ecosystem/repository-lifecycle.json docs/ECOSYSTEM_LIFECYCLE.md
          git commit -m "docs(ecosystem): resolve lifecycle pending review"
          git push origin HEAD:"$GITHUB_REF_NAME"
