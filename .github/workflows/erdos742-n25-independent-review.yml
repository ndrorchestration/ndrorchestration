name: Erdos 742 n25 Independent Relaxation Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/open-problem-prospecting/erdos742/independent_n25_relaxation_check.cpp"
      - "research/open-problem-prospecting/erdos742/independent_n25_dense_case_check.cpp"
      - ".github/workflows/erdos742-n25-independent-review.yml"

permissions:
  contents: read

jobs:
  reproduce-finite-relaxation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile equality and upper-range reviewer
        run: |
          g++ -O3 -std=c++20 \
            research/open-problem-prospecting/erdos742/independent_n25_relaxation_check.cpp \
            -o /tmp/erdos742-n25-review
      - name: Reproduce equality and Fan-free finite counts
        run: /tmp/erdos742-n25-review
      - name: Compile dense-case reviewer
        run: |
          g++ -O3 -std=c++20 \
            research/open-problem-prospecting/erdos742/independent_n25_dense_case_check.cpp \
            -o /tmp/erdos742-n25-dense-review
      - name: Reproduce dense/equality case counts
        run: /tmp/erdos742-n25-dense-review
