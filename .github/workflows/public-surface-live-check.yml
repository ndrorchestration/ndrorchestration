name: Public Surface Live Check

on:
  pull_request:
    paths:
      - 'docs/public-surface-manifest.v1.json'
      - 'scripts/verify_public_surfaces_live.py'
      - 'scripts/validate_public_surface_manifest.py'
      - '.github/workflows/public-surface-live-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * *'

permissions:
  contents: read

concurrency:
  group: public-surface-live-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source-head semantics
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [[ -n "${PR_HEAD_SHA}" && "${ACTUAL}" != "${PR_HEAD_SHA}" ]]; then
            echo "Expected PR head ${PR_HEAD_SHA}, got ${ACTUAL}" >&2
            exit 1
          fi
          echo "PUBLIC_SURFACE_SOURCE_HEAD=${ACTUAL}"

      - name: Verify manifest structure first
        run: python3 scripts/validate_public_surface_manifest.py

      - name: Check public surfaces
        run: python3 scripts/verify_public_surfaces_live.py

      - name: Verify live-check receipt
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check public-surface-live-check.sha256
          echo "PUBLIC_SURFACE_LIVE_CHECK_RECEIPT_VERIFY=PASS"

      - name: Upload live-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-surface-live-check-${{ github.sha }}
          path: |
            public-surface-live-check.json
            public-surface-live-check.sha256
          if-no-files-found: error
          retention-days: 30
