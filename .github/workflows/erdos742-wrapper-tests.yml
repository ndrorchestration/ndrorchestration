name: Erdos 742 Wrapper Tests (No Solver)

on:
  push:
    paths:
      - "research/open-problem-prospecting/erdos742/**"
      - ".github/workflows/erdos742-wrapper-tests.yml"
  pull_request:
    paths:
      - "research/open-problem-prospecting/erdos742/**"
      - ".github/workflows/erdos742-wrapper-tests.yml"

permissions:
  contents: read

jobs:
  wrapper-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile wrapper
        run: |
          python -m py_compile \
            research/open-problem-prospecting/erdos742/harness.py \
            research/open-problem-prospecting/erdos742/validate_manifest.py

      - name: Run wrapper tests
        run: pytest research/open-problem-prospecting/erdos742/tests -q
